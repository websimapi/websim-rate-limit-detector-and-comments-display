<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    
    .comment {
      margin-bottom: 1em;
    }
    
    .username {
      font-weight: bold;
      color: #1a73e8;
    }
    
    .date {
      color: #666;
      font-size: 0.9em;
    }

    .controls {
      margin-bottom: 20px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
    }

    .status {
      margin-top: 10px;
      font-size: 0.9em;
      color: #666;
    }

    .error {
      color: #d32f2f;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="testRate">Test Rate Limit</button>
    <div id="status" class="status"></div>
  </div>
  <ol id="comments"></ol>

  <script>
    class RateLimitDetector {
      constructor(projectId) {
        this.projectId = projectId;
        this.initialDelay = 1000; // Start with 1 request per second
        this.minDelay = 50; // Don't go faster than 50ms between requests
        this.currentDelay = this.initialDelay;
        this.errorCount = 0;
        this.totalRequests = 0;
        this.running = false;
      }

      async testEndpoint() {
        try {
          const start = Date.now();
          const response = await fetch(`/api/v1/projects/${this.projectId}/comments`);
          const elapsed = Date.now() - start;
          
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          
          this.totalRequests++;
          return { success: true, elapsed };
        } catch (err) {
          this.errorCount++;
          return { success: false, error: err.message };
        }
      }

      async detect() {
        this.running = true;
        this.errorCount = 0;
        this.totalRequests = 0;
        this.currentDelay = this.initialDelay;
        
        const statusEl = document.getElementById('status');
        
        while (this.running && this.currentDelay >= this.minDelay) {
          statusEl.textContent = `Testing: ${Math.round(1000/this.currentDelay)} requests/second...`;
          
          const result = await this.testEndpoint();
          
          if (!result.success) {
            // Found the limit - calculate recommended rate
            const safeDelay = this.currentDelay * 1.5; // Add 50% buffer
            const ratePerSecond = Math.floor(1000 / safeDelay);
            
            statusEl.innerHTML = `
              <div>Rate limit detected!</div>
              <div>Recommended rate: ${ratePerSecond} requests/second</div>
              <div>Total requests: ${this.totalRequests}</div>
              <div>Errors encountered: ${this.errorCount}</div>
            `;
            
            return ratePerSecond;
          }

          await new Promise(resolve => setTimeout(resolve, this.currentDelay));
          
          // Speed up requests by 10% each time
          this.currentDelay = Math.max(this.minDelay, this.currentDelay * 0.9);
        }

        if (!this.running) {
          statusEl.textContent = 'Test cancelled';
        }
      }

      stop() {
        this.running = false;
      }
    }

    async function loadComments() {
      const project = await window.websim.getCurrentProject();
      const response = await fetch(`/api/v1/projects/${project.id}/comments`);
      const data = await response.json();

      const commentsEl = document.getElementById('comments');
      commentsEl.innerHTML = ''; // Clear existing comments
      
      data.comments.data.forEach(({comment}) => {
        const li = document.createElement('li');
        li.className = 'comment';
        
        const content = comment.raw_content || 
          comment.content?.children?.[0]?.children?.[0]?.text || 
          'No content';
          
        const date = new Date(comment.created_at).toLocaleString();
        
        li.innerHTML = `
          <span class="username">${comment.author?.username || 'Anonymous'}:</span>
          ${content}
          <span class="date">${date}</span>
        `;
        
        commentsEl.appendChild(li);
      });
    }

    // Initialize
    async function init() {
      const project = await window.websim.getCurrentProject();
      const detector = new RateLimitDetector(project.id);
      
      document.getElementById('testRate').addEventListener('click', async () => {
        const button = document.getElementById('testRate');
        if (button.textContent === 'Test Rate Limit') {
          button.textContent = 'Stop Test';
          await detector.detect();
        } else {
          button.textContent = 'Test Rate Limit';
          detector.stop();
        }
      });
    }

    init();
    loadComments();
  </script>
